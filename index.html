<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кнопка → Gmail</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#1c2333; --accent:#2f6fed; --ok:#1f9d55; --err:#d93025; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2030; --text:#eef1f8; --accent:#5b8cff; --ok:#3ecf7b; --err:#ff6b60; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { background:var(--card); padding:32px; border-radius:16px; width:min(92vw,400px); text-align:center;
         box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  p { margin:0 0 20px; opacity:.7; }
  textarea { width:100%; min-height:80px; padding:10px; border-radius:10px; border:1px solid rgba(128,128,128,.4);
             background:transparent; color:inherit; font:inherit; resize:vertical; margin-bottom:16px; }
  button { width:100%; padding:14px; font-size:1rem; font-weight:600; border:0; border-radius:10px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  #status { margin-top:16px; min-height:1.4em; font-weight:500; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Отправить мне письмо</h1>
  <p>Нажмите кнопку — сообщение придёт на Gmail.</p>
  <textarea id="msg" placeholder="Текст сообщения (необязательно)"></textarea>
  <button id="btn">Отправить</button>
  <div id="status" role="status"></div>
</main>

<script>
  // Письма приходят на этот адрес (через сервис formsubmit.co)
  const FORM_URL = "https://formsubmit.co/ajax/qadimovrasul77@gmail.com";

  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const msg = document.getElementById("msg");

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    status.className = "";
    status.textContent = "Отправляю…";
    try {
      const res = await fetch(FORM_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          message: msg.value.trim() || "Кнопка на сайте была нажата",
          time: new Date().toLocaleString("ru-RU")
        })
      });
      if (!res.ok) throw new Error();
      status.className = "ok";
      status.textContent = "Отправлено. Проверьте почту.";
      msg.value = "";
    } catch (e) {
      status.className = "err";
      status.textContent = "Не удалось отправить. Откройте сайт с хостинга и подтвердите адрес по первому письму.";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
